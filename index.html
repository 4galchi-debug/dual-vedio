<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>동시재생</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{min-height:100vh;padding:18px 14px 30px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:4px 0}.pick{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:12px 14px;background:#333;color:#fff;font-size:15px}
input{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.box{background:#000;aspect-ratio:9/16;border-radius:10px;overflow:hidden;position:relative}
video{width:100%;height:100%;object-fit:contain;background:#000}.label{position:absolute;left:8px;top:8px;background:#000a;padding:4px 7px;border-radius:7px;font-size:12px;z-index:2}
.controls{display:flex;gap:8px;align-items:center}.controls .btn{flex:1}.range{width:100%}
#status{font-size:13px;color:#aaa;min-height:18px}
</style>
</head>
<body>
<main>
<h1>영상 동시재생</h1>
<div class="pick">
<label class="btn">영상 1 선택<input id="f1" type="file" accept="video/*"></label>
<label class="btn">영상 2 선택<input id="f2" type="file" accept="video/*"></label>
</div>
<div class="grid">
<div class="box"><span class="label">영상 1</span><video id="v1" playsinline preload="metadata"></video></div>
<div class="box"><span class="label">영상 2</span><video id="v2" playsinline preload="metadata"></video></div>
</div>
<div class="controls">
<button class="btn" id="play">▶️ 재생</button>
<button class="btn" id="pause">⏸ 일시정지</button>
<button class="btn" id="restart">↩ 처음부터</button>
</div>
<div>영상 1 음량 <input class="range" id="r1" type="range" min="0" max="1" step=".01" value="1"></div>
<div>영상 2 음량 <input class="range" id="r2" type="range" min="0" max="1" step=".01" value="1"></div>
<div id="status">영상 두 개를 선택하면 동시에 재생할 수 있어.</div>
</main>
<script>
const v1=document.querySelector('#v1'),v2=document.querySelector('#v2');
const status=document.querySelector('#status');
function pick(input,video,n){
 input.addEventListener('change',()=>{const f=input.files[0];if(!f)return;
 video.src=URL.createObjectURL(f); video.load(); status.textContent=`영상 ${n} 선택됨`;
 });
}
pick(f1,v1,1);pick(f2,v2,2);
play.onclick=async()=>{
 if(!v1.src||!v2.src){status.textContent='영상 두 개를 먼저 선택해줘.';return}
 const t=Math.max(v1.currentTime||0,v2.currentTime||0);
 try{v1.currentTime=t;v2.currentTime=t;}catch(e){}
 await Promise.allSettled([v1.play(),v2.play()]);
 status.textContent='두 영상 재생 중';
};
pause.onclick=()=>{v1.pause();v2.pause();status.textContent='일시정지';};
restart.onclick=()=>{v1.currentTime=0;v2.currentTime=0;status.textContent='처음으로 이동';};
r1.oninput=e=>v1.volume=e.target.value;
r2.oninput=e=>v2.volume=e.target.value;
</script>
</body>
</html>
